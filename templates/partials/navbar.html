<!-- Navbar -->
<header class="fixed top-0 left-0 right-0 z-40 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-colors duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Navegación principal">
        <div class="flex items-center justify-between h-16 lg:h-20">
            <!-- Logo -->
            <a href="{% url 'catalog:home' %}" class="flex items-center gap-2 text-xl font-orbitron font-bold text-primary-600 dark:text-primary-400 hover:opacity-80 transition-opacity" aria-label="VEXOR GAMING - Inicio">
                <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="8" class="text-primary-600 dark:text-primary-400"/>
                    <path d="M8 16L14 22L24 10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="hidden sm:block">VEXOR</span>
            </a>

            <!-- Search Form (Desktop) -->
            <form action="{% url 'catalog:shop' %}" method="GET" class="hidden md:flex flex-1 max-w-md mx-8" role="search">
                <label for="search-input" class="sr-only">Buscar productos</label>
                <div class="relative w-full">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input
                        type="search"
                        id="search-input"
                        name="q"
                        placeholder="Buscar productos, marcas, categorías..."
                        value="{{ request.GET.q|default:'' }}"
                        class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="sr-only">Buscar</button>
            </form>

            <!-- Right side: Theme toggle, Cart, User -->
            <div class="flex items-center gap-4">
                <!-- Categories Dropdown (Desktop) -->
                <div class="hidden lg:block relative" x-data="{ open: false }">
                    <button
                        @click="open = !open"
                        @keydown.escape="open = false"
                        @click.outside="open = false"
                        class="flex items-center gap-2 px-4 py-2 text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-label="Categorías"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        <span>Categorías</span>
                        <svg class="w-4 h-4 transition-transform" :class="{ 'rotate-180': open }" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <div
                        x-show="open"
                        x-transition:enter="transition ease-out duration-150"
                        x-transition:enter-start="opacity-0 transform -translate-y-1"
                        x-transition:enter-end="opacity-100 transform translate-y-0"
                        x-transition:leave="transition ease-in duration-100"
                        x-transition:leave-start="opacity-100 transform translate-y-0"
                        x-transition:leave-end="opacity-0 transform -translate-y-1"
                        class="absolute left-0 top-full mt-2 w-56 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg py-2 z-50"
                        role="menu"
                    >
                        <a href="{% url 'catalog:shop' %}" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 font-medium" role="menuitem">Todas las categorías</a>
                        <hr class="my-2 border-gray-200 dark:border-gray-700">
                        {% for cat in nav_categories %}
                        <a href="{{ cat.get_absolute_url }}" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" role="menuitem">{{ cat.name }}</a>
                        {% endfor %}
                    </div>
                </div>

                <!-- Theme Toggle -->
                <button
                    @click="toggleTheme()"
                    :aria-label="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
                    class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                    aria-pressed="false"
                >
                    <svg x-show="!isDark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                    <svg x-show="isDark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>

                <!-- Cart Button -->
                <a href="{% url 'cart:detail' %}" class="relative p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" aria-label="Carrito de compras (0 items)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                    <span class="absolute -top-1 -right-1 bg-primary-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </a>

                <!-- User Menu (placeholder for future auth) -->
                <a href="{% url 'accounts:login' %}" class="hidden sm:block px-4 py-2 text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors">
                    Iniciar sesión
                </a>
                <a href="{% url 'accounts:register' %}" class="hidden sm:block px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors font-medium">
                    Registrarse
                </a>
            </div>
        </div>

        <!-- Mobile Search & Categories -->
        <div class="lg:hidden py-4 border-t border-gray-200 dark:border-gray-700">
            <div class="flex gap-2 mb-4">
                <form action="{% url 'catalog:shop' %}" method="GET" class="flex-1" role="search">
                    <label for="mobile-search" class="sr-only">Buscar productos</label>
                    <div class="relative">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input
                            type="search"
                            id="mobile-search"
                            name="q"
                            placeholder="Buscar..."
                            value="{{ request.GET.q|default:'' }}"
                            class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        >
                    </div>
                </form>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 -mx-4 px-4" role="tablist" aria-label="Categorías">
                <a href="{% url 'catalog:shop' %}" class="whitespace-nowrap px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium" role="tab" aria-selected="true">Todas</a>
                {% for cat in nav_categories %}
                <a href="{{ cat.get_absolute_url }}" class="whitespace-nowrap px-4 py-2 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" role="tab" aria-selected="false">{{ cat.name }}</a>
                {% endfor %}
            </div>
        </div>
    </nav>
</header>
